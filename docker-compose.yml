# version: "3.9"

volumes:
  kong_data: {}
  keycloak-datastore: {}
  postgres-data: {}
  mailhog: {}
  redis-stack: {}
  rabbitmq_data: {}

networks:
  keycloak-net:
  microservice-net:
    name: microservice-net
    driver: bridge
    # ipam:
    #   config:
    #     - subnet: 172.1.1.0/24

services:
  #######################################
  # Postgres: The database used by Kong
  #######################################
  kong-database:
    image: postgres:9.6
    restart: on-failure
    container_name: kong-database
    networks:
      - microservice-net
    volumes:
      - kong_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 30s
      timeout: 30s
      retries: 3

  #######################################
  # Kong database migration
  #######################################
  kong-migration:
    build:
      context: ./config
      dockerfile: Dockerfile
    command: kong migrations bootstrap
    networks:
      - microservice-net
    restart: on-failure
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    depends_on:
      - kong-database

  #######################################
  # Kong: The API Gateway
  #######################################
  kong:
    build:
      context: ./config
      dockerfile: Dockerfile
    container_name: kong
    restart: on-failure
    networks:
      # microservice-net:
      # ipv4_address: 172.1.1.40
      - microservice-net
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl # to secure the admin API comment this line. it is not recommended to expose the admin API from localhost or outside the cluster
      KONG_PLUGINSERVER_NAMES: js
      KONG_PLUGINSERVER_JS_SOCKET: /usr/local/kong/js_pluginserver.sock
      KONG_PLUGINSERVER_JS_START_CMD: /usr/local/bin/kong-js-pluginserver -v --plugins-directory /usr/local/kong/js-plugins
      KONG_PLUGINSERVER_JS_QUERY_CMD: /usr/local/bin/kong-js-pluginserver --plugins-directory /usr/local/kong/js-plugins --dump-all-plugins
      KONG_PLUGINS: bundled
    depends_on:
      - kong-database
      - kong-migration
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"
      - "8444:8444"

  #######################################
  # Konga database prepare
  #######################################
  konga-prepare:
    image: pantsel/konga:latest
    command: "-c prepare -a postgres -u postgresql://kong:kong@kong-database:5432/konga"
    networks:
      - microservice-net
    restart: on-failure
    depends_on:
      - kong-database

  #######################################
  # Konga: Kong GUI
  #######################################
  konga:
    image: pantsel/konga:latest
    restart: always
    networks:
      - microservice-net
    environment:
      DB_ADAPTER: postgres
      DB_URI: postgresql://kong:kong@kong-database:5432/konga
      NODE_ENV: production
    depends_on:
      - kong-database
    ports:
      - "1337:1337"

  # Service for service/*
  postgres:
    image: postgres:13
    container_name: postgres
    networks:
      - microservice-net
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 30s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
      - "5051:443"
    networks:
      - microservice-net

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog2
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - microservice-net
    volumes:
      - mailhog:/var/lib/mailhog

  redis-stack:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
      - "8002:8001"
    networks:
      - microservice-net
    volumes:
      - redis-stack:/var/lib/redis-stack
    environment:
      - REDIS_ARGS=--save 900 1

  rabbitmq:
    image: rabbitmq:3.8-management
    ports:
      - "5672:5672" # RabbitMQ main port
      - "15672:15672" # RabbitMQ management UI port
    networks:
      - microservice-net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service container

  product:
    build:
      context: ./services/product
    ports:
      - "4001:4001"
    env_file:
      - ./services/product/.env
    depends_on:
      - postgres
      - inventory
    networks:
      - microservice-net

  inventory:
    build:
      context: ./services/inventory
    ports:
      - "4002:4002"
    env_file:
      - ./services/inventory/.env
    depends_on:
      - postgres
    networks:
      - microservice-net

  auth:
    build:
      context: ./services/auth
    ports:
      - "4003:4003"
    env_file:
      - ./services/auth/.env
    depends_on:
      - postgres
      - user
      - email
    networks:
      - microservice-net

  user:
    build:
      context: ./services/user
    ports:
      - "4004:4004"
    env_file:
      - ./services/user/.env
    depends_on:
      - postgres
    networks:
      - microservice-net
  email:
    build:
      context: ./services/email
    ports:
      - "4005:4005"
    env_file:
      - ./services/email/.env
    depends_on:
      - postgres
      - mailhog
    networks:
      - microservice-net
  cart:
    build:
      context: ./services/cart
    ports:
      - "4006:4006"
    env_file:
      - ./services/cart/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
      redis-stack:
        condition: service_started
      inventory:
        condition: service_started
    networks:
      - microservice-net

  order:
    build:
      context: ./services/order
    ports:
      - "4008:4008"
    env_file:
      - ./services/order/.env
    depends_on:
      - postgres
      - product
      - cart
      - email
      - rabbitmq
    networks:
      - microservice-net
